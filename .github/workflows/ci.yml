name: ElectroRent CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ========================================================
  # JOB 1: Backend Quality Gates (Lint, Unit & Integration Tests)
  # ========================================================
  backend-test:
    name: Backend Lint & Automated Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Code Linter
        working-directory: ./backend
        run: npm run lint

      - name: Execute Automated Backend Test Suite
        working-directory: ./backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_devops
          MONGO_URI: mongodb://localhost:27017/electronic_rental_ci
          LATE_FEE_MULTIPLIER: 1.5
        run: npm test

  # ========================================================
  # JOB 2: Frontend Quality Gates (Lint & Production Build)
  # ========================================================
  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Code Linter
        working-directory: ./frontend
        run: npm run lint

      - name: Build React Production Bundle
        working-directory: ./frontend
        env:
          VITE_API_URL: /api
        run: npm run build

  # ========================================================
  # JOB 3: Containerization Validation (Docker Builds)
  # ========================================================
  docker-validation:
    name: Docker Container Image Build Verification
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: electro-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: electro-frontend:ci-test
