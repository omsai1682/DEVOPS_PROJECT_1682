name: ElectroRent Continuous Deployment (CD)

on:
  push:
    branches: [ main, production ]
  workflow_dispatch:

jobs:
  deploy-production:
    name: Production Deployment Pipeline
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # ========================================================
      # STEP 1: Verify Secrets Configuration
      # ========================================================
      - name: Audit Required Deployment Secrets
        run: |
          echo "Auditing production secret availability in GitHub Secrets vault..."
          if [ -z "${{ secrets.MONGO_URI }}" ]; then
            echo "WARNING: MONGO_URI secret is not configured in repository secrets."
          fi
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "WARNING: JWT_SECRET secret is not configured in repository secrets."
          fi
          echo "Secret audit completed."

      # ========================================================
      # STEP 2: Optional Container Registry Publishing (e.g. Docker Hub)
      # ========================================================
      - name: Log in to Docker Registry
        if: "${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Production Image
        if: "${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}"
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/electro-backend:latest

      - name: Build and Push Frontend Production Image
        if: "${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}"
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/electro-frontend:latest

      # ========================================================
      # STEP 3: Automated Cloud Deploy Trigger (Render / Railway / Webhook)
      # ========================================================
      - name: Trigger Backend Cloud Deployment Webhook
        if: "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK != '' }}"
        run: |
          echo "Triggering cloud deploy hook for backend service..."
          curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Deploy Frontend to Vercel
        if: "${{ secrets.VERCEL_TOKEN != '' }}"
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'

      - name: Deployment Completed Notice
        run: |
          echo "=========================================================="
          echo " ElectroRent Continuous Deployment Finished Successfully!"
          echo " Target Environment: Production"
          echo " Timestamp: $(date -u)"
          echo "=========================================================="
